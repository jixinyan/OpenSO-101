name: test

on:
  push:
    branches: [main, codex/v2-scenes]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      OPENSO101_SKIP_ISAAC: "1"
      PYTHONPATH: src
      MUJOCO_GL: osmesa
      TMPDIR: ${{ github.workspace }}/outputs/tmp
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 创建中间文件目录
        run: mkdir -p outputs/tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-cpu-tests.txt
            requirements-mujoco.txt
      - name: 安装 CPU renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6
      - name: 安装 CPU 检查依赖
        run: python -m pip install -r requirements-cpu-tests.txt
      - name: 验证官方资产来源
        run: python scripts/fetch_cpu_assets.py --output outputs/ci/assets.json
      - name: 检查源码与命令入口
        run: python -m openso101.cli.main validate source --output outputs/ci/source
      - name: 检查未定义名称
        run: python -m ruff check src scripts tests --select F821,F822,F823 --output-format=json > outputs/ci/undefined_names.json
      - name: 运行实际几何与进程检查
        run: python scripts/run_cpu_checks.py --output outputs/ci/geometry
      - name: 运行终端、控制和配置检查
        run: |
          python -m pytest tests/scenes/test_terminal_keyboard.py \
            tests/scenes/test_controls.py tests/scenes/test_training_config.py \
            tests/scenes/test_evaluation.py tests/test_cli_rl.py \
            tests/test_cli_il.py tests/test_lerobot_push_dataset.py \
            tests/scenes/test_recording_timing.py \
            --basetemp=outputs/ci/interfaces --junitxml=outputs/ci/interfaces.xml -q
      - name: 保存 CPU 检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-validation
          path: outputs/ci/

  build:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      OPENSO101_SKIP_ISAAC: "1"
      PYTHONPATH: src
      TMPDIR: ${{ github.workspace }}/outputs/tmp
    steps:
      - uses: actions/checkout@v4
      - name: 创建中间文件目录
        run: mkdir -p outputs/tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装打包检查依赖
        run: python -m pip install build 'pydantic>=2.10,<3'
      - name: 构建与验证实际 wheel
        run: |
          python -m build --outdir outputs/build
          python -m openso101.cli.main validate package \
            --wheel outputs/build/openso_101-0.1.0-py3-none-any.whl \
            --output outputs/ci/package
      - name: 保存 wheel 与核查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-validation
          path: |
            outputs/build/
            outputs/ci/package/
